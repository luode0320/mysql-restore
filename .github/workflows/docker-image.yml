name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and push image
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u luode0320 --password-stdin
          docker build --pull --no-cache -t luode0320/mysql-restore:latest .
          docker push luode0320/mysql-restore:latest

      - name: Deploy helper container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: root
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: 22
          script: |
            docker rm -f mysql-restore || true
            docker ps -aq --filter "label=app=mysql-restore" | xargs -r docker rm -f
            docker ps -aq --filter "ancestor=luode0320/mysql-restore:latest" | xargs -r docker rm -f
            docker image rm luode0320/mysql-restore:latest || true
            docker pull luode0320/mysql-restore:latest
            mkdir -p /usr/local/src/restoredb/ddl /usr/local/src/restoredb/ddl-backup /usr/local/src/restoredb/restore-jobs
            docker run -d \
              --network host \
              --restart=always \
              --label app=mysql-restore \
              -e DB_HOST=127.0.0.1 \
              -e DB_PORT=33060 \
              -e DB_USER=root \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e DB_SSL_MODE=DISABLED \
              -e RESTORE_ROOT=/usr/local/src/restoredb \
              -e DDL_DIR=/usr/local/src/restoredb/ddl \
              -e DDL_BACKUP_DIR=/usr/local/src/restoredb/ddl-backup \
              -e RESTORE_OUTPUT_DIR=/usr/local/src/restoredb/restore-jobs \
              -e DDL_SYNC_ENABLED=true \
              -e DDL_SYNC_DAILY_TIME=00:00 \
              -e DDL_BACKUP_RETENTION_DAYS=31 \
              -e PORT="33061" \
              -v /usr/local/src/restoredb:/usr/local/src/restoredb \
              --name mysql-restore \
              luode0320/mysql-restore:latest
            docker exec mysql-restore test ! -e /app/scripts/export_ddl.sh
            docker exec mysql-restore grep -n "def run_ddl_sync_once" /app/server.py
            docker exec mysql-restore grep -n "dump_table_ddl" /app/server.py
            docker logs --tail 20 mysql-restore
